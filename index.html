<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Iron Front</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="shell">
      <section class="game-frame" aria-label="Iron Front game">
        <canvas id="game" width="960" height="540"></canvas>
        <div id="overlay" class="overlay is-visible">
          <div class="panel">
            <p class="kicker">HDL RUN AND GUN</p>
            <h1>IRON FRONT</h1>
            <p id="overlayText">突破前线，摧毁关底战争机器。</p>
            <button id="startButton" type="button">开始游戏</button>
          </div>
        </div>
      </section>
      <footer>
        <span>Art fallback active. Credits in CREDITS.md.</span>
        <span id="statusText">Ready</span>
      </footer>
    </main>

    <script src="./src/assets.js"></script>
    <script src="./src/audio.js"></script>
    <script src="./src/game.js"></script>
  </body>
</html>
